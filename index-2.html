<title>STEM Coaching Institute – Student Portal</title>
<style>
:root{--h:#17306b;--a:#e8a317;--bg:#f2f4f9;--t:#1b1f2a;--c:#fff;--ok:#157a3d;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--t:#e8eaf0;--c:#1a1e28;--ok:#4cc27f;--bad:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--h);color:#fff;padding:14px 12px;text-align:center;border-bottom:4px solid var(--a)}
header h1{margin:0;font-size:1.25rem}header p{margin:2px 0 0;font-size:.82rem;opacity:.9}
main{max-width:720px;margin:auto;padding:12px}
.card{background:var(--c);border-radius:8px;padding:14px;margin:10px 0;border:1px solid #8883}
input,select,textarea,button{font:inherit;width:100%;padding:11px;margin:5px 0;border-radius:6px;border:1px solid #8886;background:var(--c);color:var(--t)}
button{background:var(--h);color:#fff;border:0;cursor:pointer;font-weight:600}
button.s{background:#5b6275}
.row{display:flex;gap:6px}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #8884;border-radius:6px;margin:6px 0}
.opt input{width:auto;margin:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#timer{position:sticky;top:0;z-index:5;background:var(--a);color:#222;padding:8px;text-align:center;border-radius:6px;font-weight:700}
a{color:var(--h)}@media(prefers-color-scheme:dark){a{color:#8fb0ff}}
.th{display:flex;justify-content:space-between;align-items:center;background:#17306b;color:#fff;padding:8px 10px;border-radius:6px;position:sticky;top:0;z-index:5}
.tm{background:#fff;color:#17306b;padding:2px 10px;border-radius:4px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin:8px 0;overflow-x:auto}
.tabs button{width:auto;white-space:nowrap;background:#5b6275;margin:0;padding:8px 14px}
.tabs button.on{background:#17306b;box-shadow:inset 0 -4px 0 #e8a317}
.g{display:grid;gap:10px}
@media(min-width:800px){.g{grid-template-columns:1fr 260px}main{max-width:1000px}}
.qh{display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid #8884;padding-bottom:6px;margin-bottom:8px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pg button{margin:0;padding:9px 0;color:#fff;font-weight:700}
.pg .s0{background:#c9ccd4;color:#222}.pg .s1{background:#d9382b}.pg .s2{background:#2e9b4e}.pg .s3{background:#7b3fb5}.pg .s4{background:#7b3fb5;box-shadow:inset 0 -6px 0 #2e9b4e}
.pg .cur{outline:3px solid #e8a317}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.lg i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:5px}
header{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}.logo{width:64px;height:64px;border-radius:50%;flex:none}

<script>
const cfg={apiKey:"AIzaSyDQ1AjgkcsiZRx2Rhzt3rdzKzVkXgsNak4",authDomain:"stem-coaching.firebaseapp.com",projectId:"stem-coaching",storageBucket:"stem-coaching.firebasestorage.app",messagingSenderId:"947770205223",appId:"1:947770205223:web:aec031896125916fe91a02"};
firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id),app=$('app');
const DOM='@stemcoaching.app',TEACHER='teacher'+DOM;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,timerId=null;

function loginView(msg=''){
 app.innerHTML=`<div class="card"><h3>Student login</h3><input id="u" placeholder="Roll number" autocapitalize="off" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Login</button><p class="bad">${msg}</p></div>`;
 $('go').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('u').value.trim().toLowerCase()+DOM,$('p').value)}catch(e){loginView('Wrong roll number or password.')}};
}
auth.onAuthStateChanged(u=>{
 clearInterval(timerId);$('bar').innerHTML='';
 if(!u)return loginView();
 me=u;$('bar').innerHTML='<button class="s" onclick="auth.signOut()">Logout</button>';
 u.email===TEACHER?teacherView():studentView();
});

/* ---------- STUDENT ---------- */
async function studentView(){
 app.innerHTML='Loading…';
 const sd=await db.collection('students').doc(me.uid).get(),st=sd.data()||{};
 const [ts,rs]=await Promise.all([db.collection('tests').get(),db.collection('results').where('uid','==',me.uid).get()]);
 const done={};rs.forEach(d=>done[d.data().testId]=1);
 const now=Date.now(),list=ts.docs.filter(d=>d.data().live!==false&&(!d.data().cls||d.data().cls===st.cls)).map(d=>{
  const t=d.data(),n=t.qs?t.qs.length:t.n,f=t.start&&t.start.toMillis()>now;
  return `<div class="card"><b>${esc(t.title)}</b><br>${n} questions, ${t.mins} minutes<br>`+
   (done[d.id]?`<button class="s" onclick="review('${d.id}')">View result</button>`:f?`<b>Starts on ${t.start.toDate().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</b><br><small>Refresh this page at that time.</small>`:`<button onclick="startTest('${d.id}')">Start test</button>`)+'</div>'}).join('');
 app.innerHTML=`<div class="card"><b>${esc(st.name||'')}</b><br>Roll no: ${esc(st.roll||'')} | Class ${esc(st.cls||'')}</div><h3>Mock tests</h3>`+(list||'<p>No tests available yet.</p>');
}
async function startTest(id){
 const T=(await db.collection('tests').doc(id).get()).data(),pos=T.pos??4,neg=T.neg??1;
 if(!T.qs){try{T.qs=(await db.collection('qbank').doc(id).get()).data().qs}catch(e){return alert('This test has not started yet. Please try again at the start time.')}}
 app.innerHTML=`<div class="card"><h3>${esc(T.title)}</h3><p>Duration: ${T.mins} minutes. Questions: ${T.qs.length}.<br>Correct answer: +${pos} marks. Wrong multiple-choice answer: −${neg} mark. Numerical questions have no negative marking. Unanswered questions get 0.</p>
 <p class="lg"><i style="background:#c9ccd4"></i>Not visited<br><i style="background:#d9382b"></i>Not answered<br><i style="background:#2e9b4e"></i>Answered<br><i style="background:#7b3fb5"></i>Marked for review<br><i style="background:#7b3fb5;box-shadow:inset 0 -5px 0 #2e9b4e"></i>Answered and marked for review (this answer is counted)</p>
 <p>Tap Save &amp; Next to save each answer. The test submits by itself when the time ends. You can attempt this test only once.</p>
 <label class="opt"><input type="checkbox" id="rd">I have read the instructions</label><button id="bg">Start test</button></div>`;
 $('bg').onclick=()=>$('rd').checked?runTest(id,T):alert('Please tick the box first.');
}
const qs_=(T,i)=>{const q=T.qs[i];return{...q,s:q.s||'General',t:q.t||(q.o?'mcq':'num')}};
const unans=(v,t)=>v==null||(t!=='num'&&v===-1);
function score(T,K,A){
 const pos=T.pos??4,neg=T.neg??1,r={sc:0,ok:0,bad:0,un:0,sec:{}};
 T.qs.forEach((_,i)=>{const q=qs_(T,i),a=A[i],k=K[i];r.sec[q.s]=r.sec[q.s]||0;
  if(unans(a,q.t)){r.un++;return}
  const ok=q.t==='num'?Math.abs(a-k)<0.01:a===k,m=ok?pos:-(q.t==='num'?0:neg);
  ok?r.ok++:r.bad++;r.sc+=m;r.sec[q.s]+=m});
 return r;
}
let X;
const tm=()=>{const s=Math.max(0,Math.round((X.end-Date.now())/1000));return[s/3600|0,(s/60|0)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':')};
function runTest(id,T){
 const n=T.qs.length;
 X={id,T,n,secs:[...new Set(T.qs.map((_,i)=>qs_(T,i).s))],i:0,a:Array(n).fill(null),st:Array(n).fill(0),sub:false,end:Date.now()+T.mins*60000};
 go(0);
 timerId=setInterval(()=>{const e=$('tm');if(e)e.textContent=tm();if(Date.now()>=X.end)submitT()},1000);
}
function go(i){X.i=Math.max(0,Math.min(X.n-1,i));if(X.st[X.i]===0)X.st[X.i]=1;draw()}
function cur(){
 const q=qs_(X.T,X.i);
 if(q.t==='num'){const v=$('nv').value.trim();return v===''||isNaN(v)?null:+v}
 const c=document.querySelector('input[name=o]:checked');return c?+c.value:null;
}
function act(k){
 const i=X.i;
 if(k===1){X.a[i]=cur();X.st[i]=X.a[i]==null?1:2}
 else if(k===2){X.a[i]=cur();X.st[i]=X.a[i]==null?3:4}
 else if(k===3){X.a[i]=null;X.st[i]=3}
 else{X.a[i]=null;X.st[i]=1;draw();return}
 go(i+1);
}
function draw(){
 const {T,i}=X,q=qs_(T,i),sec=q.s,idx=T.qs.map((_,k)=>k).filter(k=>qs_(T,k).s===sec),a=X.a[i],c=[0,0,0,0,0];
 X.st.forEach(v=>c[v]++);
 app.innerHTML=`<div class="th"><b>${esc(T.title)}</b><span class="tm" id="tm">${tm()}</span></div>
 <div class="tabs">${X.secs.map(s=>`<button class="${s===sec?'on':''}" onclick="go(${T.qs.findIndex((_,k)=>qs_(T,k).s===s)})">${esc(s)}</button>`).join('')}</div>
 <div class="g"><div class="card"><div class="qh"><span>Question ${idx.indexOf(i)+1}</span><span>+${T.pos??4} / −${q.t==='num'?0:T.neg??1}</span></div><p>${esc(q.q)}</p>`+
 (q.t==='num'?`<input id="nv" inputmode="decimal" placeholder="Type your numerical answer" value="${a??''}">`:q.o.map((o,j)=>`<label class="opt"><input type="radio" name="o" value="${j}" ${a===j?'checked':''}>${esc(o)}</label>`).join(''))+
 `<div class="btns"><button onclick="act(1)">Save &amp; Next</button><button class="s" onclick="act(2)">Save &amp; Mark for Review</button><button class="s" onclick="act(3)">Mark for Review &amp; Next</button><button class="s" onclick="act(4)">Clear Response</button></div>
 <div class="btns"><button class="s" onclick="go(X.i-1)">&lt;&lt; Back</button><button class="s" onclick="go(X.i+1)">Next &gt;&gt;</button></div></div>
 <div class="card"><div class="pg">${idx.map((k,m)=>`<button class="s${X.st[k]} ${k===i?'cur':''}" onclick="go(${k})">${m+1}</button>`).join('')}</div>
 <p class="lg"><small><i style="background:#2e9b4e"></i>${c[2]} answered &nbsp;<i style="background:#d9382b"></i>${c[1]} not answered<br><i style="background:#7b3fb5"></i>${c[3]+c[4]} marked &nbsp;<i style="background:#c9ccd4"></i>${c[0]} not visited</small></p>
 <button onclick="submitT(1)">Submit test</button></div></div>`;
}
async function submitT(ask){
 if(X.sub)return;const c=[0,0,0,0,0];X.st.forEach(v=>c[v]++);
 if(ask&&!confirm('Answered: '+(c[2]+c[4])+'\nNot answered: '+(c[1]+c[3])+'\nNot visited: '+c[0]+'\n\nSubmit the test now?'))return;
 X.sub=true;clearInterval(timerId);
 try{await db.collection('results').doc(me.uid+'_'+X.id).set({uid:me.uid,testId:X.id,a:X.a,at:firebase.firestore.FieldValue.serverTimestamp()});review(X.id)}
 catch(e){alert('Could not submit: '+e.message);X.sub=false}
}
async function review(id){
 const [t,k,r]=await Promise.all([db.collection('tests').doc(id).get(),db.collection('keys').doc(id).get(),db.collection('results').doc(me.uid+'_'+id).get()]);
 const T=t.data();if(!T.qs)T.qs=(await db.collection('qbank').doc(id).get()).data().qs;const K=k.data().ans,A=r.data().a,R=score(T,K,A);
 app.innerHTML=`<div class="card"><h3>${esc(T.title)}</h3><h2>Score: ${R.sc} / ${T.qs.length*(T.pos??4)}</h2>Correct: ${R.ok} | Wrong: ${R.bad} | Not attempted: ${R.un}<br>`+Object.entries(R.sec).map(([s,v])=>`${esc(s)}: <b>${v}</b>`).join(' | ')+'</div>'+
 T.qs.map((_,i)=>{const q=qs_(T,i),a=A[i],un=unans(a,q.t),ok=!un&&(q.t==='num'?Math.abs(a-K[i])<0.01:a===K[i]),sh=v=>q.t==='num'?v:esc(q.o[v]);
  return `<div class="card"><b>${i+1}. ${esc(q.q)}</b> <small>(${esc(q.s)})</small><br>Your answer: <span class="${ok?'ok':'bad'}">${un?'Not attempted':sh(a)}</span>`+(ok?'':`<br>Correct answer: <span class="ok">${sh(K[i])}</span>`)+'</div>'}).join('')+
 '<button class="s" onclick="studentView()">Back to tests</button>';
}

/* ---------- TEACHER ---------- */
function teacherView(tab='r'){
 app.innerHTML='<div class="row"><button onclick="teacherView(\'s\')">Add student</button><button onclick="teacherView(\'t\')">New test</button><button onclick="teacherView(\'m\')">Tests</button><button onclick="teacherView(\'r\')">Results</button></div><div id="tv"></div>';
 ({s:addStudent,t:newTest,m:testsView,r:results})[tab]();
}
function addStudent(){
 $('tv').innerHTML='<div class="card"><h3>Add student</h3><input id="n" placeholder="Student name"><input id="r" placeholder="Roll number (letters and numbers only)"><input id="c" placeholder="Class (for example 10 or 12)"><input id="pw" placeholder="Password (at least 6 characters)"><button id="add">Create student login</button><p id="m"></p></div>';
 $('add').onclick=async()=>{
  const roll=$('r').value.trim().toLowerCase(),name=$('n').value.trim();
  if(!/^[a-z0-9]+$/.test(roll)||$('pw').value.length<6||!name)return $('m').textContent='Fill every field correctly.';
  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(cfg,'sec');
  try{
   const cr=await sec.auth().createUserWithEmailAndPassword(roll+DOM,$('pw').value);
   await db.collection('students').doc(cr.user.uid).set({name,roll,cls:$('c').value.trim()});
   await sec.auth().signOut();
   $('m').textContent='Created. Roll no: '+roll+', password: '+$('pw').value;
  }catch(e){$('m').textContent=e.code==='auth/email-already-in-use'?'This roll number already exists.':e.message}
 };
}
const P={neet:{n:{Physics:45,Chemistry:45,Biology:90},m:180},bio:{n:{Biology:90},m:90},phy:{n:{Physics:45},m:45},chem:{n:{Chemistry:45},m:45}};
function norm(pat,qs){const p=P[pat];if(p)qs.forEach(x=>{const m=Object.keys(p.n).find(k=>k.toLowerCase()===x.s.toLowerCase());if(m)x.s=m})}
function chk(pat,qs){const p=P[pat];if(!p)return '';
 if(qs.some(x=>x.t==='num'))return 'NEET tests have multiple-choice questions only.';
 const c={};qs.forEach(x=>c[x.s]=(c[x.s]||0)+1);
 for(const [k,n] of Object.entries(p.n))if((c[k]||0)!==n)return k+' has '+(c[k]||0)+' questions but needs '+n+'.';
 return Object.keys(c).length!==Object.keys(p.n).length?'Use only these subject names: '+Object.keys(p.n).join(', ')+'.':'';}
function parseQ(txt,sec='General'){
 const qs=[],ans=[];
 for(const blk of txt.split(/\n\s*\n/)){
  const L=blk.trim().split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)continue;
  const sl=L.find(l=>/^SEC/i.test(l));if(sl)sec=sl.replace(/^SEC[:\s]*/i,'').trim()||sec;
  const ql=L.find(l=>/^Q/i.test(l));if(!ql)continue;
  const q=ql.replace(/^Q[:.]?\s*/i,''),nl=L.find(l=>/^NUM/i.test(l));
  if(nl){const v=parseFloat(nl.replace(/^NUM[:\s]*/i,''));if(isNaN(v))return{err:'Check the NUM line in: '+q};qs.push({q,s:sec,t:'num'});ans.push(v);continue}
  const o=L.filter(l=>/^[A-D]\)/i.test(l)).map(l=>l.slice(2).trim()),an=L.find(l=>/^ANS/i.test(l)),k=an?'ABCD'.indexOf(an.replace(/^ANS[:\s]*/i,'').trim().charAt(0).toUpperCase()):-1;
  if(o.length<2||k<0||k>=o.length)return{err:'Check this question: '+q};
  qs.push({q,o,s:sec,t:'mcq'});ans.push(k);
 }
 return{qs,ans};
}
function newTest(){
 $('tv').innerHTML=`<div class="card"><h3>New mock test</h3><select id="pt"><option value="custom">Custom test</option><option value="neet">Full NEET (Physics 45, Chemistry 45, Biology 90)</option><option value="bio">Biology only (90 questions)</option><option value="phy">Physics only (45 questions)</option><option value="chem">Chemistry only (45 questions)</option></select><small id="ph"></small><input id="ti" placeholder="Test title"><input id="cl" placeholder="Class (leave blank for all)"><input id="mi" type="number" placeholder="Time in minutes"><div class="row"><input id="pm" type="number" value="4"><input id="nm" type="number" value="1"></div><small>Left box: marks for a correct answer. Right box: marks lost for a wrong multiple-choice answer.</small><textarea id="qt" rows="12" placeholder="SEC: Physics\nQ: Question text\nA) option 1\nB) option 2\nC) option 3\nD) option 4\nANS: B\n\nQ: A numerical question\nNUM: 24"></textarea><button id="sv">Save as draft</button><p id="m"></p><small>The test is saved as a draft that students cannot see. Open the Tests tab to add more questions, set the go-live time and publish.</small></div>`;
 $('pt').onchange=()=>{const p=P[$('pt').value];if(p){$('mi').value=p.m;$('pm').value=4;$('nm').value=1;$('ph').textContent='Needs '+Object.entries(p.n).map(([k,c])=>c+' '+k).join(', ')+'. Write the subject names exactly like this in the SEC: lines. Multiple-choice only. Marks set to +4 and −1.'}else $('ph').textContent=''};
 $('sv').onclick=async()=>{
  const pat=$('pt').value,r=parseQ($('qt').value);if(r.err)return $('m').textContent=r.err;
  if(!$('ti').value.trim()||!+$('mi').value)return $('m').textContent='Add a title and the time in minutes.';
  norm(pat,r.qs);const ref=db.collection('tests').doc();
  try{
   await ref.set({title:$('ti').value.trim(),cls:$('cl').value.trim(),mins:+$('mi').value,pos:+$('pm').value,neg:+$('nm').value,pat,live:false,n:r.qs.length});
   await db.collection('qbank').doc(ref.id).set({qs:r.qs});
   await db.collection('keys').doc(ref.id).set({ans:r.ans});
   $('m').textContent='Draft saved with '+r.qs.length+' questions. Open the Tests tab to continue.';
  }catch(e){$('m').textContent=e.message}
 };
}
async function testsView(){
 $('tv').innerHTML='Loading…';
 const ts=await db.collection('tests').get(),fmt=t=>t.toDate().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
 $('tv').innerHTML=ts.docs.map(d=>{
  const t=d.data(),p=P[t.pat],need=p?Object.values(p.n).reduce((a,b)=>a+b):0,n=t.qs?t.qs.length:t.n,
   st=t.live===false?'Draft':(t.start&&t.start.toMillis()>Date.now()?'Scheduled for '+fmt(t.start):'Live');
  return `<div class="card"><b>${esc(t.title)}</b><br>${st} | ${n??'?'} questions${need?' of '+need:''}`+(t.qs?'':
   `<br><button class="s" onclick="addQ('${d.id}')">Add more questions</button><label>Go live at (leave blank for now):</label><input type="datetime-local" id="dt${d.id}"><button onclick="publish('${d.id}')">Publish</button><button class="s" onclick="unpub('${d.id}')">Make draft</button><div id="aq${d.id}"></div>`)+'</div>'}).join('')||'<p>No tests yet.</p>';
}
function addQ(id){$('aq'+id).innerHTML=`<textarea id="ax${id}" rows="8" placeholder="Paste more questions here. Add a SEC: line if the subject changes."></textarea><button onclick="saveQ('${id}')">Add these questions</button><p id="am${id}"></p>`}
async function saveQ(id){
 const m=$('am'+id),tr=db.collection('tests').doc(id);
 try{
  const [t,qb,k]=await Promise.all([tr.get(),db.collection('qbank').doc(id).get(),db.collection('keys').doc(id).get()]);
  const T=t.data(),qs=qb.data().qs,ans=k.data().ans;
  if(T.live!==false)return m.textContent='Tap Make draft first, then add questions.';
  const r=parseQ($('ax'+id).value,qs.length?qs[qs.length-1].s:'General');if(r.err)return m.textContent=r.err;
  norm(T.pat,r.qs);const Q=[...qs,...r.qs],A=[...ans,...r.ans];
  await db.collection('qbank').doc(id).set({qs:Q});await db.collection('keys').doc(id).set({ans:A});await tr.update({n:Q.length});
  m.textContent='Added. Total '+Q.length+' questions.';
 }catch(e){m.textContent=e.message}
}
async function publish(id){
 const tr=db.collection('tests').doc(id),v=$('dt'+id).value;
 try{
  const T=(await tr.get()).data(),Q=(await db.collection('qbank').doc(id).get()).data().qs;
  const e=!Q.length?'Add questions first.':chk(T.pat,Q);if(e)return alert(e);
  await tr.update({live:true,start:v?firebase.firestore.Timestamp.fromDate(new Date(v)):firebase.firestore.FieldValue.serverTimestamp()});
  testsView();
 }catch(e){alert(e.message)}
}
async function unpub(id){await db.collection('tests').doc(id).update({live:false});testsView()}
async function results(){
 $('tv').innerHTML='Loading…';
 const [ts,ks,st,rs,qb]=await Promise.all(['tests','keys','students','results','qbank'].map(c=>db.collection(c).get()));const Q={};qb.forEach(d=>Q[d.id]=d.data().qs);
 const K={},S={};ks.forEach(d=>K[d.id]=d.data().ans);st.forEach(d=>S[d.id]=d.data());
 $('tv').innerHTML=ts.docs.map(d=>{
  const t={...d.data()};t.qs=t.qs||Q[d.id]||[];const rows=rs.docs.filter(r=>r.data().testId===d.id).map(r=>{
   const x=r.data(),s=S[x.uid]||{};return{n:s.name||'?',roll:s.roll||'',sc:score(t,K[d.id]||[],x.a).sc,id:r.id}}).sort((a,b)=>b.sc-a.sc);
  return `<div class="card"><b>${esc(t.title)}</b> (${t.qs.length} questions)<br>`+(rows.map((r,i)=>`${i+1}. ${esc(r.n)} (${esc(r.roll)}): <b>${r.sc}</b> <a href="#" onclick="allow('${r.id}');return false">allow retake</a><br>`).join('')||'No attempts yet.')+'</div>';
 }).join('')||'<p>No tests yet.</p>';
}
async function allow(id){if(confirm('Delete this result so the student can retake the test?')){await db.collection('results').doc(id).delete();results()}}
</script></body></html>
