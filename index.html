<style>
:root{--h:#17306b;--a:#e8a317;--bg:#f2f4f9;--t:#1b1f2a;--c:#fff;--ok:#157a3d;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--t:#e8eaf0;--c:#1a1e28;--ok:#4cc27f;--bad:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}
.logo{object-fit:cover;background:#fbf8ee;border:2px solid #d7ad55;box-shadow:0 5px 18px rgba(0,0,0,.25)}
header{background:var(--h);color:#fff;padding:14px 12px;text-align:center;border-bottom:4px solid var(--a)}
header h1{margin:0;font-size:1.25rem}header p{margin:2px 0 0;font-size:.82rem;opacity:.9}
main{max-width:720px;margin:auto;padding:12px}
.card{background:var(--c);border-radius:8px;padding:14px;margin:10px 0;border:1px solid #8883}
input,select,textarea,button{font:inherit;width:100%;padding:11px;margin:5px 0;border-radius:6px;border:1px solid #8886;background:var(--c);color:var(--t)}
button{background:var(--h);color:#fff;border:0;cursor:pointer;font-weight:600}
button.s{background:#5b6275}
.row{display:flex;gap:6px}.bd,.bo{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:700;margin:2px 0}.bd{background:#e8a317;color:#222}.bo{background:#17306b;color:#fff}.tr{flex-wrap:wrap}.tr button{flex:1 1 40%}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #8884;border-radius:6px;margin:6px 0}
.opt input{width:auto;margin:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#timer{position:sticky;top:0;z-index:5;background:var(--a);color:#222;padding:8px;text-align:center;border-radius:6px;font-weight:700}
a{color:var(--h)}@media(prefers-color-scheme:dark){a{color:#8fb0ff}}
.th{display:flex;justify-content:space-between;align-items:center;background:#17306b;color:#fff;padding:8px 10px;border-radius:6px;position:sticky;top:0;z-index:5}
.tm{background:#fff;color:#17306b;padding:2px 10px;border-radius:4px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin:8px 0;overflow-x:auto}
.tabs button{width:auto;white-space:nowrap;background:#5b6275;margin:0;padding:8px 14px}
.tabs button.on{background:#17306b;box-shadow:inset 0 -4px 0 #e8a317}
.g{display:grid;gap:10px}
@media(min-width:800px){.g{grid-template-columns:1fr 260px}main{max-width:1000px}}
.qh{display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid #8884;padding-bottom:6px;margin-bottom:8px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pg button{margin:0;padding:9px 0;color:#fff;font-weight:700}

.pg .cur{outline:3px solid #e8a317}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.lg i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:5px}
header{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}.logo{width:64px;height:64px;border-radius:50%;flex:none}

:root{

  background:

  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;

  position:relative;
  padding:22px 20px;

}

  content:"";

  background:linear-gradient(90deg,transparent,#f5d98d,transparent);
}

/* OPTION 6 — INTERFACE REDESIGN V3: tabs, controls, typography, interaction states */
:root{
 --ink:#172033;--navy:#101b31;--navy2:#1c3152;--gold:#c49a45;--gold2:#f0d99f;
 --paper:#f4f1e9;--surface:#fffefa;--stroke:#e4ddcf;--muted:#697386;
 --success:#21764b;--danger:#a83d42;
}
html{scroll-behavior:smooth}
body{

}
body,button,input,select,textarea{cursor:default}
button,a,summary,label[for],input[type=checkbox],input[type=radio],select{cursor:pointer}
a{color:#8b682f;text-decoration-thickness:1px;text-underline-offset:3px}

header{

}

 transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card:hover{transform:translateY(-3px);border-color:#d2bd8e;box-shadow:0 15px 30px rgba(35,37,40,.10)}
/* Main navigation tabs become a distinct premium segmented control */
.tabs{

 box-shadow:inset 0 1px 2px #0000000b;
}

 box-shadow:none;white-space:nowrap;transition:all .18s ease;
}
.tabs button:hover{background:#fffaf0;color:#18243a;transform:translateY(-1px)}
.tabs button.on{

 border-color:#b89550;box-shadow:0 4px 10px #101b3126,inset 0 1px #ffffff20;
}

button{

 background:linear-gradient(125deg,#14233c,#304663);color:#fff;

 box-shadow:0 4px 10px rgba(16,27,49,.13);
 transition:transform .16s ease,box-shadow .16s ease,background .16s ease,filter .16s ease;
}
button:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 8px 16px #101b312b}
button:active{transform:translateY(0) scale(.985);box-shadow:0 2px 5px #101b3120}
button:focus-visible,a:focus-visible,summary:focus-visible{
 outline:3px solid #d4ad5c;outline-offset:3px;
}
button.s{

 box-shadow:none;
}
button.s:hover{background:#e9dfca;color:#1b2940}
.btns{gap:10px}
input,select,textarea{

 transition:border-color .16s,box-shadow .16s,background .16s;

input::placeholder,textarea::placeholder{color:#9aa1ad}

<script>
const cfg={apiKey:"AIzaSyDQ1AjgkcsiZRx2Rhzt3rdzKzVkXgsNak4",authDomain:"stem-coaching.firebaseapp.com",projectId:"stem-coaching",storageBucket:"stem-coaching.firebasestorage.app",messagingSenderId:"947770205223",appId:"1:947770205223:web:aec031896125916fe91a02"};
firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id),app=$('app');
const DOM='@stemcoaching.app',TEACHER='teacher'+DOM;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,timerId=null;

let busy=false;
const barHtml=()=>'<div class="row"><button class="s" onclick="pwView()">Change password</button><button class="s" onclick="auth.signOut()">Logout</button></div>';
const back=()=>me&&me.email===TEACHER?teacherView():studentView();
function loginView(msg=''){
  app.innerHTML=`<div class="card"><h3>Student login</h3><input id="u" placeholder="Mobile number or roll number" autocapitalize="off" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Login</button><p class="bad">${msg}</p><div class="row"><button class="s" id="fu">Forgot username?</button><button class="s" id="fp">Forgot password?</button></div></div><div class="card"><b>New student?</b><br><small>Create your own account in one minute.</small><button class="s" id="su">Create account</button></div>`;
  $('go').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('u').value.trim().toLowerCase()+DOM,$('p').value)}catch(e){loginView('Wrong mobile number / roll number or password.')}};
  $('su').onclick=()=>signupView();
  $('fu').onclick=()=>forgotUserView();
  $('fp').onclick=()=>forgotPwView();
}
function forgotUserView(){
  app.innerHTML=`<div class="card"><h3>Forgot username?</h3><p>Your username is the <b>10-digit mobile number</b> you used when you created your account, or the <b>roll number</b> given to you by the institute.</p><p>If you still cannot remember it, call the institute at <a href="tel:9236990414">9236990414</a> and tell us your full name and class.</p><button class="s" id="b1">Back to login</button></div>`;
  $('b1').onclick=()=>loginView();
}
function forgotPwView(){
  app.innerHTML=`<div class="card"><h3>Forgot password?</h3><p>Send a request and the institute will set a new password for you and let you know.</p>
  <input id="fn" placeholder="Your full name" autocomplete="name">
  <input id="fr" placeholder="Mobile number or roll number" autocapitalize="off">
  <button id="fs">Send request</button><p id="fx" class="bad"></p>
  <small>You can also call the institute at <a href="tel:9236990414">9236990414</a>.</small>
  <button class="s" id="b2">Back to login</button></div>`;
  $('b2').onclick=()=>loginView();
  $('fs').onclick=async()=>{
   const n=$('fn').value.trim(),r=$('fr').value.trim().toLowerCase(),x=$('fx');
   if(n.length<2||!/^[a-z0-9]+$/.test(r)){x.className='bad';return x.textContent='Please enter your name and your mobile number or roll number.'}
   $('fs').disabled=true;
   try{await db.collection('resetRequests').add({name:n,roll:r,at:firebase.firestore.FieldValue.serverTimestamp()});x.className='ok';x.textContent='Request sent. The institute will set a new password and contact you.'}
   catch(e){$('fs').disabled=false;x.className='bad';x.textContent='Could not send the request. Please call the institute: 9236990414.'}
  };
}
function pwView(){
  if($('tm'))return alert('Please finish and submit your test first.');
  app.innerHTML=`<div class="card"><h3>Change password</h3>
  <input id="cp" type="password" placeholder="Current password" autocomplete="current-password">
  <input id="np" type="password" placeholder="New password (at least 6 characters)" autocomplete="new-password">
  <input id="nq" type="password" placeholder="Confirm new password" autocomplete="new-password">
  <button id="cs">Change password</button><p id="cx" class="bad"></p><button class="s" id="cb">Back</button></div>`;
  $('cb').onclick=()=>back();
  $('cs').onclick=async()=>{
   const c=$('cp').value,n=$('np').value,q=$('nq').value,x=$('cx');x.className='bad';
   if(!c)return x.textContent='Please enter your current password.';
   if(n.length<6)return x.textContent='New password must be at least 6 characters.';
   if(n!==q)return x.textContent='The two new passwords do not match.';
   if(n===c)return x.textContent='The new password must be different from the current one.';
   $('cs').disabled=true;
   try{
    await me.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(me.email,c));
    await me.updatePassword(n);
    x.className='ok';x.textContent='Your password has been changed.';
   }catch(e){
    $('cs').disabled=false;
    x.textContent=(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'||e.code==='auth/invalid-login-credentials')?'Your current password is wrong.':e.code==='auth/too-many-requests'?'Too many attempts. Please try again after some time.':'Could not change password: '+(e.message||e.code);
   }
  };
}
function signupView(){
  app.innerHTML=`<div class="card"><h3>Create student account</h3>
  <input id="sn" placeholder="Your full name" autocomplete="name">
  <input id="sm" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="username">
  <select id="sc"><option value="">Select your class</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>Dropper</option></select>
  <input id="sp" type="password" placeholder="Create password (at least 6 characters)" autocomplete="new-password">
  <input id="sq" type="password" placeholder="Confirm password" autocomplete="new-password">
  <button id="sg">Create account</button><p class="bad" id="sx"></p>
  <small>Your mobile number will be your login ID. Please remember your password.</small>
  <button class="s" id="sb">Back to login</button></div>`;
  $('sb').onclick=()=>loginView();
  $('sg').onclick=async()=>{
   const n=$('sn').value.trim(),m=$('sm').value.trim(),c=$('sc').value,p=$('sp').value,q=$('sq').value,x=$('sx');
   if(n.length<2)return x.textContent='Please enter your name.';
   if(!/^[6-9][0-9]{9}$/.test(m))return x.textContent='Please enter a valid 10-digit mobile number.';
   if(!c)return x.textContent='Please select your class.';
   if(p.length<6)return x.textContent='Password must be at least 6 characters.';
   if(p!==q)return x.textContent='The two passwords do not match.';
   $('sg').disabled=true;x.textContent='Creating your account…';busy=true;
   try{
    const cr=await auth.createUserWithEmailAndPassword(m+DOM,p);
    try{await db.collection('students').doc(cr.user.uid).set({name:n,roll:m,cls:c,plans:[],self:true,at:firebase.firestore.FieldValue.serverTimestamp()})}
    catch(e){await cr.user.delete();throw{code:'save-failed'}}
    busy=false;me=cr.user;$('bar').innerHTML=barHtml();myProfile();
   }catch(e){
    busy=false;$('sg').disabled=false;
    x.textContent=e.code==='auth/email-already-in-use'?'This mobile number is already registered. Please go back and login.':e.code==='save-failed'?'Could not save your account. Please contact the institute.':'Could not create account: '+(e.message||e.code);
   }
  };
}
auth.onAuthStateChanged(u=>{
  if(busy)return;
  clearInterval(timerId);$('bar').innerHTML='';wmOff();
  if(!u)return loginView();
  me=u;$('bar').innerHTML=barHtml();
  u.email===TEACHER?teacherView():myProfile();
 });

/* ---------- STUDENT ---------- */
const OFFG=['neetoff','biooff','phyoff','chemoff'];
const grp=k=>k==='neet'?['neet','bio','phy','chem']:k==='neetoff'?OFFG:[k];
const owns=(st,k)=>{const p=st.plans||[];return p.includes(k)||(p.includes('neet')&&['bio','phy','chem'].includes(k))||(p.includes('neetoff')&&['biooff','phyoff','chemoff'].includes(k))};
const pnName=x=>(x.title||'')+(x.mode==='offline'?' (Offline at centre)':' (Online)');
const modeBadge=x=>x.mode==='offline'?'<span class="bd">OFFLINE AT CENTRE</span>':'<span class="bo">ONLINE</span>';
async function studentView(f){
 wmOff();
 if(typeof f!=='string')f=null;
 app.innerHTML='Loading…';
 const sd=await db.collection('students').doc(me.uid).get(),st=sd.data()||{};
 if(!sd.exists){app.innerHTML='<div class="card">Your account is not active. Please contact STEM Coaching Institute.</div>';return}
 const [ts,rs]=await Promise.all([db.collection('tests').get(),db.collection('results').where('uid','==',me.uid).get()]);
 const done={};rs.forEach(d=>done[d.data().testId]=1);
 const now=Date.now(),list=ts.docs.filter(d=>d.data().live!==false&&canSee(d.data(),st)&&(!f||grp(f).includes(d.data().pat||'custom'))).map(d=>{
  const t=d.data(),n=t.qs?t.qs.length:t.n,f=t.start&&t.start.toMillis()>now;
  return `<div class="card"><b>${esc(t.title)}</b><br>${n} questions, ${t.mins} minutes<br>`+
   (done[d.id]?`<button class="s" onclick="review('${d.id}')">View result</button>`:f?`<b>Starts on ${t.start.toDate().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</b><br><small>Refresh this page at that time.</small>`:`<button onclick="startTest('${d.id}')">Start test</button>`)+'</div>'}).join('');

function parseQ(txt,sec='General'){
 const qs=[],ans=[];
 for(const blk of txt.split(/\n\s*\n/)){
  const L=blk.trim().split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)continue;
  const sl=L.find(l=>/^SEC/i.test(l));if(sl)sec=sl.replace(/^SEC[:\s]*/i,'').trim()||sec;
  const ql=L.find(l=>/^Q/i.test(l));if(!ql)continue;
  const ex=[];for(let z=L.indexOf(ql)+1;z<L.length;z++){const l=L[z];if(/^[A-D]\)/i.test(l))break;if(/^(ANS|NUM|SEC|IMG)[:\s]/i.test(l))continue;ex.push(l)}
  const q=[ql.replace(/^Q[:.]?\s*/i,''),...ex].join('\n'),il=L.find(l=>/^IMG[:\s]/i.test(l)),img=il?il.replace(/^IMG[:\s]*/i,'').trim():'',im=img?{img}:{},nl=L.find(l=>/^NUM[:\s]/i.test(l));
  if(nl){const v=parseFloat(nl.replace(/^NUM[:\s]*/i,''));if(isNaN(v))return{err:'Check the NUM line in: '+q};qs.push({q,s:sec,t:'num',...im});ans.push(v);continue}
  const o=L.filter(l=>/^[A-D]\)/i.test(l)).map(l=>l.slice(2).trim()),an=L.find(l=>/^ANS[:\s]/i.test(l)),k=an?'ABCD'.indexOf(an.replace(/^ANS[:\s]*/i,'').trim().charAt(0).toUpperCase()):-1;
  if(o.length<2||k<0||k>=o.length)return{err:'Check this question: '+q};
  qs.push({q,o,s:sec,t:'mcq',...im});ans.push(k);
 }
 return{qs,ans};
}

 const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

 const three=x=>(x>=100?a[x/100|0]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
 let r='';const c=n/10000000|0,l=(n/100000|0)%100,t=(n/1000|0)%100,h=n%1000;
 if(c)r+=two(c)+' Crore ';if(l)r+=two(l)+' Lakh ';if(t)r+=two(t)+' Thousand ';if(h)r+=three(h);

   await firebase.functions().httpsCallable('resetStudentPassword')({uid:s.docs[0].id,password:np});
   await db.collection('resetRequests').doc(id).delete();
   alert('Done. New password for '+roll+': '+np+'\nPlease tell the student, and ask them to change it after login.');resetReqs();
  }catch(e){alert('Could not set the password: '+(e.message||e.code)+'\n\nThis button needs the password-reset function to be set up first.')}
}
async function allow(id){if(confirm('Delete this result so the student can retake the test?')){await db.collection('results').doc(id).delete();results()}}
</script></body></html>
