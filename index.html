<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEM Coaching Institute – Student Portal</title>
<style>
:root{--h:#17306b;--a:#e8a317;--bg:#f2f4f9;--t:#1b1f2a;--c:#fff;--ok:#157a3d;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--t:#e8eaf0;--c:#1a1e28;--ok:#4cc27f;--bad:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--h);color:#fff;padding:14px 12px;text-align:center;border-bottom:4px solid var(--a)}
header h1{margin:0;font-size:1.25rem}header p{margin:2px 0 0;font-size:.82rem;opacity:.9}
main{max-width:720px;margin:auto;padding:12px}
.card{background:var(--c);border-radius:8px;padding:14px;margin:10px 0;border:1px solid #8883}
input,select,textarea,button{font:inherit;width:100%;padding:11px;margin:5px 0;border-radius:6px;border:1px solid #8886;background:var(--c);color:var(--t)}
button{background:var(--h);color:#fff;border:0;cursor:pointer;font-weight:600}
button.s{background:#5b6275}
.row{display:flex;gap:6px}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #8884;border-radius:6px;margin:6px 0}
.opt input{width:auto;margin:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#timer{position:sticky;top:0;z-index:5;background:var(--a);color:#222;padding:8px;text-align:center;border-radius:6px;font-weight:700}
a{color:var(--h)}@media(prefers-color-scheme:dark){a{color:#8fb0ff}}
</style></head><body>
<header><h1>STEM COACHING INSTITUTE</h1>
<p>NEET / Board / Medical / Foundation</p>
<p>Pargyapuram, Lakhpedabagh, Barabanki • 9236990414</p></header>
<main><div id="bar"></div><div id="app">Loading…</div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyDQ1AjgkcsiZRx2Rhzt3rdzKzVkXgsNak4",authDomain:"stem-coaching.firebaseapp.com",projectId:"stem-coaching",storageBucket:"stem-coaching.firebasestorage.app",messagingSenderId:"947770205223",appId:"1:947770205223:web:aec031896125916fe91a02"};
firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id),app=$('app');
const DOM='@stemcoaching.app',TEACHER='teacher'+DOM;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,timerId=null;

function loginView(msg=''){
 app.innerHTML=`<div class="card"><h3>Student login</h3><input id="u" placeholder="Roll number" autocapitalize="off" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Login</button><p class="bad">${msg}</p></div>`;
 $('go').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('u').value.trim().toLowerCase()+DOM,$('p').value)}catch(e){loginView('Wrong roll number or password.')}};
}
auth.onAuthStateChanged(u=>{
 clearInterval(timerId);$('bar').innerHTML='';
 if(!u)return loginView();
 me=u;$('bar').innerHTML='<button class="s" onclick="auth.signOut()">Logout</button>';
 u.email===TEACHER?teacherView():studentView();
});

/* ---------- STUDENT ---------- */
async function studentView(){
 app.innerHTML='Loading…';
 const sd=await db.collection('students').doc(me.uid).get(),st=sd.data()||{};
 const [ts,rs]=await Promise.all([db.collection('tests').get(),db.collection('results').where('uid','==',me.uid).get()]);
 const done={};rs.forEach(d=>done[d.data().testId]=1);
 const list=ts.docs.filter(d=>!d.data().cls||d.data().cls===st.cls).map(d=>{
  const t=d.data();
  return `<div class="card"><b>${esc(t.title)}</b><br>${t.qs.length} questions, ${t.mins} minutes<br>`+
   (done[d.id]?`<button class="s" onclick="review('${d.id}')">View result</button>`:`<button onclick="startTest('${d.id}')">Start test</button>`)+`</div>`}).join('');
 app.innerHTML=`<div class="card"><b>${esc(st.name||'')}</b><br>Roll no: ${esc(st.roll||'')} | Class ${esc(st.cls||'')}</div><h3>Mock tests</h3>`+(list||'<p>No tests available yet.</p>');
}
async function startTest(id){
 const t=(await db.collection('tests').doc(id).get()).data(),end=Date.now()+t.mins*60000;let sub=false;
 app.innerHTML=`<div id="timer"></div><h3>${esc(t.title)}</h3>`+t.qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`).join('')+'</div>').join('')+'<button id="sub">Submit test</button>';
 const submit=async()=>{
  if(sub)return;sub=true;clearInterval(timerId);
  const a=t.qs.map((_,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);return c?+c.value:-1});
  try{await db.collection('results').doc(me.uid+'_'+id).set({uid:me.uid,testId:id,a,at:firebase.firestore.FieldValue.serverTimestamp()});review(id)}
  catch(e){alert('Could not submit: '+e.message);sub=false}
 };
 $('sub').onclick=()=>confirm('Submit the test now?')&&submit();
 timerId=setInterval(()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));$('timer').textContent='Time left: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)submit()},1000);
}
async function review(id){
 const [t,k,r]=await Promise.all([db.collection('tests').doc(id).get(),db.collection('keys').doc(id).get(),db.collection('results').doc(me.uid+'_'+id).get()]);
 const T=t.data(),K=k.data().ans,A=r.data().a;let sc=0;
 const body=T.qs.map((q,i)=>{const ok=A[i]===K[i];if(ok)sc++;
  return `<div class="card"><b>${i+1}. ${esc(q.q)}</b><br>Your answer: <span class="${ok?'ok':'bad'}">${A[i]<0?'Not answered':esc(q.o[A[i]])}</span>`+(ok?'':`<br>Correct answer: <span class="ok">${esc(q.o[K[i]])}</span>`)+'</div>'}).join('');
 app.innerHTML=`<div class="card"><h3>${esc(T.title)}</h3><h2>Score: ${sc} / ${T.qs.length}</h2></div>${body}<button class="s" onclick="studentView()">Back to tests</button>`;
}

/* ---------- TEACHER ---------- */
function teacherView(tab='r'){
 app.innerHTML='<div class="row"><button onclick="teacherView(\'s\')">Add student</button><button onclick="teacherView(\'t\')">New test</button><button onclick="teacherView(\'r\')">Results</button></div><div id="tv"></div>';
 ({s:addStudent,t:newTest,r:results})[tab]();
}
function addStudent(){
 $('tv').innerHTML='<div class="card"><h3>Add student</h3><input id="n" placeholder="Student name"><input id="r" placeholder="Roll number (letters and numbers only)"><input id="c" placeholder="Class (for example 10 or 12)"><input id="pw" placeholder="Password (at least 6 characters)"><button id="add">Create student login</button><p id="m"></p></div>';
 $('add').onclick=async()=>{
  const roll=$('r').value.trim().toLowerCase(),name=$('n').value.trim();
  if(!/^[a-z0-9]+$/.test(roll)||$('pw').value.length<6||!name)return $('m').textContent='Fill every field correctly.';
  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(cfg,'sec');
  try{
   const cr=await sec.auth().createUserWithEmailAndPassword(roll+DOM,$('pw').value);
   await db.collection('students').doc(cr.user.uid).set({name,roll,cls:$('c').value.trim()});
   await sec.auth().signOut();
   $('m').textContent='Created. Roll no: '+roll+', password: '+$('pw').value;
  }catch(e){$('m').textContent=e.code==='auth/email-already-in-use'?'This roll number already exists.':e.message}
 };
}
function newTest(){
 $('tv').innerHTML='<div class="card"><h3>New mock test</h3><input id="ti" placeholder="Test title"><input id="cl" placeholder="Class (leave blank for all)"><input id="mi" type="number" placeholder="Time in minutes"><textarea id="qt" rows="12" placeholder="Q: Question text\nA) option 1\nB) option 2\nC) option 3\nD) option 4\nANS: B\n\n(leave a blank line, then write the next question)"></textarea><button id="sv">Save test</button><p id="m"></p></div>';
 $('sv').onclick=async()=>{
  const qs=[],ans=[];
  for(const blk of $('qt').value.split(/\n\s*\n/)){
   const L=blk.trim().split('\n').map(s=>s.trim());if(!L[0])continue;
   const q=L[0].replace(/^Q[:.]?\s*/i,''),o=L.filter(l=>/^[A-D]\)/i.test(l)).map(l=>l.slice(2).trim());
   const an=L.find(l=>/^ANS/i.test(l)),k=an?'ABCD'.indexOf(an.replace(/^ANS[:\s]*/i,'').trim().charAt(0).toUpperCase()):-1;
   if(o.length<2||k<0||k>=o.length)return $('m').textContent='Check this question: '+q;
   qs.push({q,o});ans.push(k);
  }
  if(!qs.length||!$('ti').value.trim()||!+$('mi').value)return $('m').textContent='Add a title, minutes and questions.';
  const ref=db.collection('tests').doc();
  try{
   await ref.set({title:$('ti').value.trim(),cls:$('cl').value.trim(),mins:+$('mi').value,qs});
   await db.collection('keys').doc(ref.id).set({ans});
   $('m').textContent='Saved '+qs.length+' questions.';
  }catch(e){$('m').textContent=e.message}
 };
}
async function results(){
 $('tv').innerHTML='Loading…';
 const [ts,ks,st,rs]=await Promise.all(['tests','keys','students','results'].map(c=>db.collection(c).get()));
 const K={},S={};ks.forEach(d=>K[d.id]=d.data().ans);st.forEach(d=>S[d.id]=d.data());
 $('tv').innerHTML=ts.docs.map(d=>{
  const t=d.data(),rows=rs.docs.filter(r=>r.data().testId===d.id).map(r=>{
   const x=r.data(),s=S[x.uid]||{};return{n:s.name||'?',roll:s.roll||'',sc:x.a.filter((v,i)=>v===K[d.id][i]).length,id:r.id}}).sort((a,b)=>b.sc-a.sc);
  return `<div class="card"><b>${esc(t.title)}</b> (${t.qs.length} questions)<br>`+(rows.map((r,i)=>`${i+1}. ${esc(r.n)} (${esc(r.roll)}): <b>${r.sc}</b> <a href="#" onclick="allow('${r.id}');return false">allow retake</a><br>`).join('')||'No attempts yet.')+'</div>';
 }).join('')||'<p>No tests yet.</p>';
}
async function allow(id){if(confirm('Delete this result so the student can retake the test?')){await db.collection('results').doc(id).delete();results()}}
</script></body></html>
